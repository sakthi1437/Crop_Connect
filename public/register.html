<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register | Crop Connect</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <header>
      <div class="container navbar">
        <div class="brand">Crop Connect</div>
        <nav class="nav-links">
          <a href="/">Home</a>
          <a href="/products.html">Browse Crops</a>
          <a href="/login.html">Login</a>
        </nav>
      </div>
    </header>

    <main class="container auth-layout">
      <div class="form-shell">
        <h1>Create Account</h1>
        <form id="register-form">
          <div class="form-row">
            <div class="form-group">
              <label for="name">Full Name</label>
              <input type="text" id="name" name="name" required />
            </div>
            <div class="form-group">
              <label for="email">Email</label>
              <input type="email" id="email" name="email" required />
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="phone">Phone</label>
              <input type="tel" id="phone" name="phone" required />
            </div>
            <div class="form-group">
              <label for="role">Role</label>
              <select id="role-select" name="role" required>
                <option value="customer">Customer</option>
                <option value="farmer">Farmer</option>
              </select>
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="password">Password</label>
              <input type="password" id="password" name="password" required />
            </div>
            <div class="form-group">
              <label for="confirmPassword">Confirm Password</label>
              <input type="password" id="confirmPassword" name="confirmPassword" required />
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="address">Address</label>
              <input type="text" id="address" name="address" />
            </div>
            <div class="form-group">
              <label for="city">City</label>
              <input type="text" id="city" name="city" />
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="district">District</label>
              <input type="text" id="district" name="district" />
            </div>
            <div class="form-group">
              <label for="state">State</label>
              <input type="text" id="state" name="state" />
            </div>
          </div>

          <div class="form-group">
            <label for="pincode">Pincode</label>
            <input type="text" id="pincode" name="pincode" />
          </div>

          <div id="farmer-extra-fields" class="hidden">
            <div class="form-row">
              <div class="form-group">
                <label for="farmName">Farm Name</label>
                <input type="text" id="farmName" name="farmName" />
              </div>
              <div class="form-group">
                <label for="farmLocation">Farm Location</label>
                <input type="text" id="farmLocation" name="farmLocation" />
              </div>
            </div>
            <div class="form-group">
              <label for="village">Village</label>
              <input type="text" id="village" name="village" />
            </div>
          </div>

          <button class="btn btn-primary" type="submit">Register</button>
        </form>
      </div>
    </main>

    <script src="/js/main.js"></script>
    <script src="/js/auth.js"></script>
  </body>
</html>
