<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | Crop Connect</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <header>
      <div class="container navbar">
        <div class="brand">Crop Connect</div>
        <nav class="nav-links">
          <a href="/">Home</a>
          <a href="/products.html">Browse Crops</a>
          <a href="/register.html">Register</a>
        </nav>
      </div>
    </header>

    <main class="container auth-layout">
      <div class="form-shell">
        <h1>Login</h1>
        <p id="auth-message" class="small-muted">Access your account to continue.</p>
        <form id="login-form">
          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required />
          </div>
          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required />
          </div>
          <button class="btn btn-primary" type="submit">Login</button>
        </form>
      </div>
      <div class="form-shell">
        <h2>Need an account?</h2>
        <p>Register as a customer or a farmer to begin selling or buying fresh produce.</p>
        <a class="btn btn-secondary" href="/register.html">Create Account</a>
      </div>
    </main>

    <script src="/js/main.js"></script>
    <script src="/js/auth.js"></script>
  </body>
</html>
